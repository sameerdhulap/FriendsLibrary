name: Book availability watch

on:
  schedule:
    # Every 3 hours (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Check book availability
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: kimaya.dhulap+github@gmail.com
          # One or more book URLs, separated by comma or newline. Falls back to
          # BOOK_URL (single) and then the default book if unset.
          BOOK_URLS: ${{ vars.BOOK_URLS }}
          BOOK_URL: ${{ vars.BOOK_URL }}
          NOTIFY_ALWAYS: ${{ vars.NOTIFY }} # set the NOTIFY repo variable to "true" to email every run
        run: |
          # Run the watcher, capture its output, and surface it on the run's
          # summary page (Job Summary) while preserving the real exit code.
          set +e
          out=$(node check-book.js 2>&1)
          code=$?
          set -e
          {
            echo '### 📚 Book availability'
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$out"
          exit $code
